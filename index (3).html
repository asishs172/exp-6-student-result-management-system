<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Student Result Management System</h1>
    <p>Enter marks out of 100. Pass mark is 40 in every subject.</p>
  </header>

  <main class="layout">
    <!-- Step 3: Entry form -->
    <section class="panel">
      <h2>Enter student details</h2>
      <form id="resultForm" novalidate>
        <div class="field">
          <label for="name">Student name</label>
          <input type="text" id="name" autocomplete="off">
          <small class="error" id="nameError"></small>
        </div>
        <div class="field">
          <label for="roll">Roll number</label>
          <input type="text" id="roll" autocomplete="off">
          <small class="error" id="rollError"></small>
        </div>

        <div class="marks-grid">
          <div class="field">
            <label for="m1">Mathematics</label>
            <input type="number" id="m1" min="0" max="100" inputmode="numeric">
            <small class="error"></small>
          </div>
          <div class="field">
            <label for="m2">Physics</label>
            <input type="number" id="m2" min="0" max="100" inputmode="numeric">
            <small class="error"></small>
          </div>
          <div class="field">
            <label for="m3">Chemistry</label>
            <input type="number" id="m3" min="0" max="100" inputmode="numeric">
            <small class="error"></small>
          </div>
          <div class="field">
            <label for="m4">English</label>
            <input type="number" id="m4" min="0" max="100" inputmode="numeric">
            <small class="error"></small>
          </div>
          <div class="field">
            <label for="m5">Computer Science</label>
            <input type="number" id="m5" min="0" max="100" inputmode="numeric">
            <small class="error"></small>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary">Add result</button>
          <button type="button" class="btn" id="clearForm">Clear form</button>
        </div>
      </form>
    </section>

    <!-- Step 7: Results table -->
    <section class="panel">
      <div class="panel-head">
        <h2>Results</h2>
        <button type="button" class="btn danger" id="clearAll">Remove all</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Roll no.</th>
              <th>Name</th>
              <th>Total (500)</th>
              <th>Percentage</th>
              <th>Grade</th>
              <th>Status</th>
              <th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <p id="emptyMsg" class="empty">No results yet. Add a student using the form.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
